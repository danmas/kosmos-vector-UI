<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Logs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            background: #020617;
            border-bottom: 2px solid #1e293b;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-icon {
            font-size: 24px;
        }
        
        .header-title h1 {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 2px;
        }
        
        .header-title .subtitle {
            font-size: 11px;
            color: #64748b;
        }
        
        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #334155;
            border-color: #475569;
        }
        
        .btn-primary {
            background: #3b82f6;
            border-color: #2563eb;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            border-color: #1d4ed8;
        }
        
        .filter-bar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 8px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .filter-label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .filter-btn {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        
        .filter-btn.active {
            background: #3b82f6;
            color: white;
        }
        
        .filter-btn:not(.active) {
            background: #0f172a;
            color: #94a3b8;
            border-color: #334155;
        }
        
        .filter-btn:not(.active):hover {
            background: #1e293b;
            color: #e2e8f0;
        }
        
        .logs-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            min-height: 0;
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .log-entry {
            display: flex;
            gap: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            margin-bottom: 2px;
            transition: background 0.1s;
            cursor: pointer;
        }
        
        .log-entry:hover {
            background: #1e293b;
        }
        
        .log-entry.expanded {
            flex-direction: column;
            background: #1e293b;
        }
        
        .log-header {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        
        .log-timestamp {
            color: #64748b;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .log-level {
            font-weight: 700;
            text-transform: uppercase;
            width: 50px;
            flex-shrink: 0;
        }
        
        .log-level.INFO {
            color: #3b82f6;
        }
        
        .log-level.WARN {
            color: #f59e0b;
        }
        
        .log-level.ERROR {
            color: #ef4444;
        }
        
        .log-message {
            flex: 1;
            color: #cbd5e1;
            word-break: break-word;
            position: relative;
        }
        
        .log-message.truncated {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .log-message-full {
            margin-top: 8px;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 11px;
            line-height: 1.5;
            color: #e2e8f0;
        }
        
        .expand-indicator {
            color: #64748b;
            font-size: 10px;
            margin-left: 8px;
            user-select: none;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
            color: #64748b;
        }
        
        .spinner {
            border: 3px solid #334155;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            font-size: 14px;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icon">📟</div>
            <div class="header-title">
                <h1>Server Logs</h1>
                <div class="subtitle">Real-time server activity monitoring</div>
            </div>
        </div>
        <div class="header-controls">
            <button class="btn" onclick="refreshLogs()">🔄 Refresh</button>
            <button class="btn" onclick="clearLogs()">🗑️ Clear</button>
            <button class="btn btn-primary" onclick="toggleAutoRefresh()">
                <span id="autoRefreshIcon">⏸️</span> Auto-refresh
            </button>
        </div>
    </div>
    
    <div class="filter-bar">
        <span class="filter-label">Filter:</span>
        <button class="filter-btn active" data-level="ALL" onclick="setFilter('ALL')">All</button>
        <button class="filter-btn" data-level="INFO" onclick="setFilter('INFO')">Info</button>
        <button class="filter-btn" data-level="WARN" onclick="setFilter('WARN')">Warnings</button>
        <button class="filter-btn" data-level="ERROR" onclick="setFilter('ERROR')">Errors</button>
    </div>
    
    <div class="logs-container">
        <div id="loading" class="loading">
            <div>
                <div class="spinner"></div>
                <div>Loading logs...</div>
            </div>
        </div>
        <div id="logsContent" style="display: none;"></div>
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📭</div>
            <div>No logs available</div>
        </div>
    </div>

    <script>
        let autoRefreshEnabled = true;
        let autoRefreshInterval = null;
        let currentFilter = 'ALL';
        let allLogs = [];
        let expandedLogs = new Set(); // Множество ID развёрнутых логов
        
        const urlParams = new URLSearchParams(window.location.search);
        const contextCode = urlParams.get('context-code') || 'KOSMOS-VECTOR';
        const MAX_MESSAGE_LENGTH = 150; // Максимальная длина для сжатого отображения
        
        function toggleLogExpand(logId, event) {
            event.stopPropagation();
            
            if (expandedLogs.has(logId)) {
                expandedLogs.delete(logId);
            } else {
                expandedLogs.add(logId);
            }
            
            // Перерендериваем логи с сохранением текущего состояния
            renderLogs(allLogs);
        }
        
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
        }
        
        function renderLogs(logs) {
            const logsContent = document.getElementById('logsContent');
            const emptyState = document.getElementById('emptyState');
            
            const filteredLogs = currentFilter === 'ALL' 
                ? logs 
                : logs.filter(log => log.level === currentFilter);
            
            if (filteredLogs.length === 0) {
                logsContent.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }
            
            emptyState.style.display = 'none';
            logsContent.style.display = 'block';
            
            // Сортируем логи по timestamp в обратном порядке (новые сверху)
            const sortedLogs = [...filteredLogs].sort((a, b) => {
                return new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime();
            });
            
            logsContent.innerHTML = sortedLogs.map(log => {
                const isExpanded = expandedLogs.has(log.id);
                const message = log.message || '';
                const isLongMessage = message.length > MAX_MESSAGE_LENGTH;
                const displayMessage = (isLongMessage && !isExpanded) 
                    ? message.substring(0, MAX_MESSAGE_LENGTH) + '...' 
                    : message;
                
                return `
                    <div class="log-entry ${isExpanded ? 'expanded' : ''}" onclick="toggleLogExpand('${log.id}', event)">
                        <div class="log-header">
                            <span class="log-timestamp">${formatTimestamp(log.timestamp)}</span>
                            <span class="log-level ${log.level}">${log.level}</span>
                            <span class="log-message ${isLongMessage && !isExpanded ? 'truncated' : ''}">
                                ${escapeHtml(displayMessage)}
                                ${isLongMessage ? `<span class="expand-indicator">${isExpanded ? '▼ Свернуть' : '▶ Развернуть'}</span>` : ''}
                            </span>
                        </div>
                        ${isExpanded && isLongMessage ? `
                            <div class="log-message-full">${escapeHtml(message)}</div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function loadLogs() {
            try {
                const url = `/api/logs?context-code=${encodeURIComponent(contextCode)}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`Failed to load logs: ${response.statusText}`);
                }
                
                const data = await response.json();
                allLogs = Array.isArray(data) ? data : (data.logs || []);
                
                document.getElementById('loading').style.display = 'none';
                renderLogs(allLogs);
            } catch (err) {
                console.error('Error loading logs:', err);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #ef4444;">
                        Error loading logs: ${err.message}
                    </div>
                `;
            }
        }
        
        function refreshLogs() {
            loadLogs();
        }
        
        async function clearLogs() {
            if (!confirm('Clear all server logs?')) return;
            
            try {
                const url = `/api/logs?context-code=${encodeURIComponent(contextCode)}`;
                const response = await fetch(url, { method: 'DELETE' });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Server error: ${response.status}`);
                }
                
                const result = await response.json();
                console.log(`[Clear] ${result.message}. Deleted: ${result.deletedCount} logs, ${result.deletedSessions || 0} sessions`);
                
                allLogs = [];
                renderLogs(allLogs);
            } catch (err) {
                console.error('Error clearing logs:', err);
                alert('Failed to clear logs: ' + err.message);
            }
        }
        
        function setFilter(level) {
            currentFilter = level;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.level === level) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            renderLogs(allLogs);
        }
        
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const icon = document.getElementById('autoRefreshIcon');
            
            if (autoRefreshEnabled) {
                icon.textContent = '⏸️';
                startAutoRefresh();
            } else {
                icon.textContent = '▶️';
                stopAutoRefresh();
            }
        }
        
        function startAutoRefresh() {
            if (autoRefreshInterval) return;
            autoRefreshInterval = setInterval(() => {
                loadLogs();
            }, 2000);
        }
        
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }
        
        // Initial load
        loadLogs();
        
        // Start auto-refresh
        if (autoRefreshEnabled) {
            startAutoRefresh();
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopAutoRefresh();
        });
    </script>
</body>
</html>
